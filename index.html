<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống Kê Chi Tiêu Grab</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f8; margin: 0; padding: 20px; color: #1c1e21; }
    .container { max-width: 700px; margin: 0 auto; }
    .header { background: #00b14f; color: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 12px rgba(0,177,79,0.2); margin-bottom: 20px; }
    .header h1 { margin: 0 0 8px 0; font-size: 20px; font-weight: 600; opacity: 0.9; }
    .total-money { font-size: 36px; font-weight: 800; margin: 0; }
    .sub-info { margin-top: 8px; font-size: 14px; opacity: 0.9; }
    .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .trip-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #eee; }
    .trip-item:last-child { border-bottom: none; }
    .trip-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .trip-date { font-size: 13px; color: #65676b; }
    .trip-amount { font-weight: 700; color: #00b14f; font-size: 16px; white-space: nowrap; margin-left: 12px; }
    .loading { text-align: center; padding: 40px; color: #65676b; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Tổng tiền đã cống hiến cho Grab</h1>
    <p class="total-money" id="totalAmount">Đang tính...</p>
    <div class="sub-info" id="totalTrips">Đang tải dữ liệu chuyến đi...</div>
  </div>

  <div class="card">
    <div id="tripList" class="loading">Đang đồng bộ từ Gmail...</div>
  </div>
</div>

<script>
  // DÁN LINK WEB APP BẠN COPY Ở BƯỚC 2 VÀO ĐÂY:
  const API_URL = "https://script.google.com/macros/s/AKfycbzgliKmLUwVZR6ZRkWenVg7hRuNlU-hdnoXG1NN4BH4Q0X5yaLGKFfLuguSBlkZqwurFw/exec";

  const formatVND = (num) => num.toLocaleString('vi-VN') + ' đ';

  async function loadGrabData() {
    try {
      const response = await fetch(API_URL);
      const data = await response.json();

      document.getElementById('totalAmount').innerText = formatVND(data.totalAmount);
      document.getElementById('totalTrips').innerText = `Tổng cộng ${data.totalTrips} chuyến đi & đơn hàng`;

      const listEl = document.getElementById('tripList');
      if (data.trips.length === 0) {
        listEl.innerHTML = "Chưa tìm thấy biên lai Grab nào trong Gmail.";
        return;
      }

      listEl.className = "";
      listEl.innerHTML = data.trips.map(trip => `
        <div class="trip-item">
          <div>
            <div class="trip-title">${trip.title}</div>
            <div class="trip-date">${trip.date}</div>
          </div>
          <div class="trip-amount">${formatVND(trip.amount)}</div>
        </div>
      `).join('');
    } catch (error) {
      document.getElementById('tripList').innerText = "Lỗi tải dữ liệu. Kiểm tra lại đường dẫn API_URL.";
      console.error(error);
    }
  }

  loadGrabData();
</script>

</body>
</html>
